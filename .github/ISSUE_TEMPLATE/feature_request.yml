name: Feature request
description: Suggest a new capability or improvement for NextDemo.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: What would you like NextDemo to do?
      description: Describe the feature and the problem it would solve for you.
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: Have you seen this somewhere?
      description: |
        If the idea is visual or interactive, link or attach an example — a video, screenshot, or another tool that does it well. Even a rough sketch helps.
    validations:
      required: false

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: How would you use this in your own demos or workflow?
    validations:
      required: false
